server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Local-only connectivity diagnostics
    location ^~ /api/dev/connectivity/ {
        proxy_pass http://admin-bff:12000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # Do not return index.html for unknown API paths
    location /api/ {
        return 404;
    }

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
